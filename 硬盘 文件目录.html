<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>硬盘 文件目录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #dbe2ea;
      --line-strong: #c5ceda;
      --text: #172033;
      --muted: #6b7688;
      --accent: #2563eb;
      --accent-soft: #e8f0ff;
      --green: #17a673;
      --warning: #b7791f;
      --shadow: 0 10px 28px rgba(15, 23, 42, .08);
      --sidebar-width: 300px;
      --row-height: 34px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      letter-spacing: 0;
    }

    body {
      min-width: 980px;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      height: 32px;
      padding: 0 10px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--line-strong);
      background: #f8fbff;
    }

    button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #174ea6;
    }

    input,
    select {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      outline: none;
      padding: 0 10px;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      flex: 0 0 auto;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(15, 23, 42, .02);
      padding: 12px 16px 10px;
      z-index: 3;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 700;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .summary-item {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      padding: 8px 10px;
    }

    .summary-item .label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-item .value {
      display: block;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .capacity {
      grid-column: span 2;
    }

    .capacity-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #e3e8f0;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--green), var(--accent));
    }

    .toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .search {
      width: 360px;
      max-width: 38vw;
    }

    .view-menu-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .view-button {
      min-width: 96px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .view-menu {
      position: absolute;
      top: 38px;
      right: 0;
      min-width: 154px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .toolbar-left .view-menu {
      left: 0;
      right: auto;
    }

    .view-menu button {
      width: 100%;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 0;
      background: transparent;
      text-align: left;
      border-radius: 5px;
    }

    .view-menu button:hover {
      background: #f0f5ff;
    }

    .view-menu button.active {
      background: var(--accent-soft);
      color: #174ea6;
    }

    .main {
      min-height: 0;
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: var(--sidebar-width) 7px minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      min-width: 180px;
      max-width: 620px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pane-head {
      height: 40px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
    }

    .tree {
      flex: 1 1 auto;
      overflow: auto;
      padding: 8px 6px 12px;
    }

    .tree-node {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 3px;
      min-height: 28px;
      padding: 0 7px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      color: #25324a;
      font-size: 13px;
    }

    .tree-node:hover {
      background: #f0f5ff;
    }

    .tree-node.active {
      background: var(--accent-soft);
      color: #174ea6;
      font-weight: 650;
    }

    .tree-node .twisty {
      width: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .tree-node .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-node .count {
      color: var(--muted);
      font-size: 12px;
    }

    .tree-children {
      margin-left: 16px;
    }

    .splitter {
      background: #edf1f6;
      border-right: 1px solid var(--line);
      cursor: col-resize;
      position: relative;
    }

    .splitter::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 50%;
      width: 3px;
      height: 46px;
      transform: translateY(-50%);
      border-left: 1px solid #aab6c6;
      border-right: 1px solid #aab6c6;
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .breadcrumb {
      min-height: 40px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      overflow: auto hidden;
      white-space: nowrap;
    }

    .crumb {
      height: 26px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      color: #1d4f91;
      cursor: pointer;
      font-size: 13px;
    }

    .crumb:hover {
      background: #eef5ff;
    }

    .crumb-sep {
      color: var(--muted);
      font-size: 12px;
    }

    .statusbar {
      height: 34px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      color: var(--muted);
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .file-panel {
      flex: 1 1 auto;
      min-height: 220px;
      min-width: 360px;
      margin: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: var(--shadow);
      overflow: auto;
      max-width: calc(100% - 20px);
      max-height: calc(100% - 20px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 34px;
      background: #f8fafc;
      color: #33415c;
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 0 10px;
      font-weight: 700;
      user-select: none;
    }

    th.sortable {
      cursor: pointer;
    }

    th .th-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      height: 100%;
      position: relative;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -10px;
      width: 10px;
      height: 100%;
      cursor: col-resize;
      z-index: 3;
    }

    tbody tr {
      height: var(--row-height);
      border-bottom: 1px solid #eef2f6;
    }

    tbody tr:hover {
      background: #f3f7ff;
    }

    td {
      padding: 0 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .type-icon {
      --icon-scale: 1;
      flex: 0 0 auto;
      width: calc(34px * var(--icon-scale));
      height: calc(32px * var(--icon-scale));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
      color: #334155;
    }

    .type-icon.small {
      --icon-scale: .9;
    }

    .type-icon.card {
      --icon-scale: 1.45;
    }

    .cards.medium .type-icon.card {
      --icon-scale: 1.75;
    }

    .cards.large .type-icon.card {
      --icon-scale: 2.12;
    }

    .type-art,
    .type-art span {
      position: absolute;
      display: block;
    }

    .ext-tag {
      position: absolute;
      right: -4px;
      bottom: -4px;
      max-width: 36px;
      height: 13px;
      padding: 0 4px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, .9);
      background: rgba(15, 23, 42, .86);
      color: #fff;
      font-size: 8px;
      line-height: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-icon.card .ext-tag {
      max-width: 48px;
      height: 16px;
      line-height: 15px;
      font-size: 10px;
      right: -5px;
      bottom: -5px;
    }

    .art-folder,
    .art-up {
      inset: calc(4px * var(--icon-scale)) calc(2px * var(--icon-scale)) calc(3px * var(--icon-scale));
    }

    .folder-tab {
      left: calc(3px * var(--icon-scale));
      top: 0;
      width: calc(13px * var(--icon-scale));
      height: calc(7px * var(--icon-scale));
      border-radius: calc(3px * var(--icon-scale)) calc(3px * var(--icon-scale)) 0 0;
      background: #f2bd3d;
      border: 1px solid #d99a16;
      border-bottom: 0;
    }

    .folder-body {
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(21px * var(--icon-scale));
      border-radius: calc(4px * var(--icon-scale));
      background: linear-gradient(#ffd96d, #f2b63d);
      border: 1px solid #d99a16;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55);
    }

    .up-arrow {
      left: 50%;
      top: calc(10px * var(--icon-scale));
      width: calc(10px * var(--icon-scale));
      height: calc(10px * var(--icon-scale));
      border-left: calc(2px * var(--icon-scale)) solid #7c4a03;
      border-top: calc(2px * var(--icon-scale)) solid #7c4a03;
      transform: translateX(-50%) rotate(45deg);
      z-index: 2;
    }

    .art-video {
      inset: calc(5px * var(--icon-scale)) calc(3px * var(--icon-scale));
      border-radius: calc(5px * var(--icon-scale));
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      border: 1px solid #1d4ed8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
    }

    .art-video::before,
    .art-video::after {
      content: "";
      position: absolute;
    }

    .art-video::before {
      left: 50%;
      top: 50%;
      transform: translate(-38%, -50%);
      border-top: calc(6px * var(--icon-scale)) solid transparent;
      border-bottom: calc(6px * var(--icon-scale)) solid transparent;
      border-left: calc(10px * var(--icon-scale)) solid #fff;
    }

    .art-video::after {
      left: calc(4px * var(--icon-scale));
      right: calc(4px * var(--icon-scale));
      top: calc(4px * var(--icon-scale));
      height: calc(2px * var(--icon-scale));
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.8) 0 calc(3px * var(--icon-scale)), transparent calc(3px * var(--icon-scale)) calc(6px * var(--icon-scale)));
    }

    .art-image {
      inset: calc(4px * var(--icon-scale)) calc(3px * var(--icon-scale));
      border-radius: calc(4px * var(--icon-scale));
      background: linear-gradient(#dff7ff, #93e0c0);
      border: 1px solid #0f9f6e;
      overflow: hidden;
    }

    .art-image::before,
    .art-image::after {
      content: "";
      position: absolute;
    }

    .art-image::before {
      right: calc(4px * var(--icon-scale));
      top: calc(4px * var(--icon-scale));
      width: calc(5px * var(--icon-scale));
      height: calc(5px * var(--icon-scale));
      border-radius: 50%;
      background: #fff7ad;
    }

    .art-image::after {
      left: calc(2px * var(--icon-scale));
      bottom: calc(2px * var(--icon-scale));
      border-left: calc(10px * var(--icon-scale)) solid transparent;
      border-right: calc(10px * var(--icon-scale)) solid transparent;
      border-bottom: calc(12px * var(--icon-scale)) solid #16a34a;
    }

    .art-audio {
      inset: calc(3px * var(--icon-scale)) calc(5px * var(--icon-scale));
    }

    .art-audio::before,
    .art-audio::after {
      content: "";
      position: absolute;
    }

    .art-audio::before {
      left: calc(10px * var(--icon-scale));
      top: calc(2px * var(--icon-scale));
      width: calc(4px * var(--icon-scale));
      height: calc(20px * var(--icon-scale));
      background: #7c3aed;
      border-radius: calc(2px * var(--icon-scale));
      box-shadow: calc(9px * var(--icon-scale)) calc(3px * var(--icon-scale)) 0 #7c3aed;
      transform: skewY(-8deg);
    }

    .art-audio::after {
      left: calc(2px * var(--icon-scale));
      bottom: calc(1px * var(--icon-scale));
      width: calc(12px * var(--icon-scale));
      height: calc(8px * var(--icon-scale));
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: calc(10px * var(--icon-scale)) calc(2px * var(--icon-scale)) 0 #a78bfa;
    }

    .art-document,
    .art-other {
      inset: calc(3px * var(--icon-scale)) calc(6px * var(--icon-scale));
      border-radius: calc(3px * var(--icon-scale));
      background: #fff;
      border: 1px solid #2f80c7;
      box-shadow: inset calc(-6px * var(--icon-scale)) calc(6px * var(--icon-scale)) 0 #dbeafe;
    }

    .art-document::before,
    .art-other::before {
      content: "";
      position: absolute;
      left: calc(4px * var(--icon-scale));
      right: calc(4px * var(--icon-scale));
      top: calc(10px * var(--icon-scale));
      height: calc(2px * var(--icon-scale));
      background: #60a5fa;
      box-shadow: 0 calc(5px * var(--icon-scale)) 0 #93c5fd, 0 calc(10px * var(--icon-scale)) 0 #bfdbfe;
    }

    .art-other {
      border-color: #64748b;
      box-shadow: inset calc(-6px * var(--icon-scale)) calc(6px * var(--icon-scale)) 0 #e2e8f0;
    }

    .art-archive {
      inset: calc(4px * var(--icon-scale)) calc(4px * var(--icon-scale));
      border-radius: calc(4px * var(--icon-scale));
      background: linear-gradient(#ffd08a, #f59e0b);
      border: 1px solid #b45309;
      overflow: hidden;
    }

    .art-archive::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: calc(4px * var(--icon-scale));
      transform: translateX(-50%);
      background: repeating-linear-gradient(#78350f 0 calc(2px * var(--icon-scale)), #fff7ed calc(2px * var(--icon-scale)) calc(4px * var(--icon-scale)));
    }

    .art-program {
      inset: calc(5px * var(--icon-scale)) calc(3px * var(--icon-scale));
      border-radius: calc(4px * var(--icon-scale));
      background: #1e293b;
      border: 1px solid #0f172a;
      box-shadow: inset 0 calc(5px * var(--icon-scale)) 0 #475569;
    }

    .art-program::before,
    .art-program::after {
      content: "";
      position: absolute;
      top: calc(12px * var(--icon-scale));
      height: calc(2px * var(--icon-scale));
      background: #86efac;
      border-radius: 999px;
    }

    .art-program::before {
      left: calc(5px * var(--icon-scale));
      width: calc(9px * var(--icon-scale));
    }

    .art-program::after {
      left: calc(16px * var(--icon-scale));
      width: calc(7px * var(--icon-scale));
    }

    .clickable-name {
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dir .clickable-name {
      color: #1d4f91;
      cursor: pointer;
      font-weight: 650;
    }

    .sort-mark {
      color: var(--accent);
      font-size: 12px;
      flex: 0 0 auto;
    }

    .cards {
      display: grid;
      gap: 8px;
      padding: 10px;
    }

    .cards.small,
    .cards.medium,
    .cards.large {
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      align-content: start;
    }

    .cards.small { --card-min: 130px; }
    .cards.medium { --card-min: 170px; }
    .cards.large { --card-min: 220px; }

    .file-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      min-width: 0;
      cursor: default;
    }

    .file-card:hover {
      border-color: var(--line-strong);
      background: #fbfdff;
    }

    .file-card.folder {
      cursor: pointer;
    }

    .cards.small .file-card,
    .cards.medium .file-card,
    .cards.large .file-card {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px;
      text-align: center;
    }

    .cards.medium .file-card { min-height: 138px; }
    .cards.large .file-card { min-height: 170px; }

    .cards.content {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      gap: 6px;
      min-height: auto;
      min-width: 0;
      background: transparent;
      overflow: visible;
    }

    .cards.content .file-card {
      min-height: 68px;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 9px 12px;
    }

    .cards.content .type-icon.card {
      --icon-scale: 1.25;
    }

    .card-name,
    .tile-name {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
      font-size: 13px;
    }

    .card-meta {
      color: var(--muted);
      font-size: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cards.tile {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      align-content: start;
    }

    .cards.tile .file-card {
      min-height: 76px;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      padding: 10px;
    }

    .tile-lines {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .content-lines {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .content-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      min-width: 0;
    }

    .tile-path,
    .content-path {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }

    .empty strong {
      display: block;
      color: #33415c;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #edf2f7;
      color: #45546c;
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 1120px) {
      body { min-width: 860px; }
      .summary { grid-template-columns: repeat(4, minmax(110px, 1fr)); }
      .capacity { grid-column: span 2; }
      .search { width: 260px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-row">
        <h1>硬盘 文件目录</h1>
        <span class="badge" id="activePathBadge"></span>
      </div>
      <section class="summary" aria-label="磁盘信息">
        <div class="summary-item"><span class="label">盘符</span><span class="value" id="driveLetter"></span></div>
        <div class="summary-item"><span class="label">序列号</span><span class="value" id="serialNumber"></span></div>
        <div class="summary-item"><span class="label">文件数量</span><span class="value" id="fileCount"></span></div>
        <div class="summary-item"><span class="label">总大小</span><span class="value" id="totalFileSize"></span></div>
        <div class="summary-item"><span class="label">最近扫描时间</span><span class="value" id="scanTime"></span></div>
        <div class="summary-item"><span class="label">导出时间</span><span class="value" id="exportTime"></span></div>
        <div class="summary-item capacity">
          <div class="capacity-line"><span id="capacityText"></span><span id="capacityPct"></span></div>
          <div class="progress"><span id="capacityBar"></span></div>
        </div>
      </section>
    </header>

    <section class="toolbar" aria-label="工具栏">
      <div class="toolbar-left">
        <button id="rootBtn" title="回到根目录">⌂ 根目录</button>
        <button id="parentBtn" title="返回上一级目录">↑ 上一级</button>
        <input class="search" id="searchInput" type="search" placeholder="搜索文件名或完整路径">
        <select id="typeFilter" title="按类型筛选">
          <option value="all">全部类型</option>
          <option value="video">视频</option>
          <option value="image">图片</option>
          <option value="audio">音频</option>
          <option value="document">文档</option>
          <option value="archive">压缩包</option>
          <option value="program">程序</option>
          <option value="other">其他</option>
        </select>
        <select id="sortSelect" title="排序字段">
          <option value="name">按名称</option>
          <option value="size">按大小</option>
          <option value="mtime">按修改时间</option>
          <option value="type">按类型</option>
          <option value="path">按路径</option>
        </select>
        <button id="sortDirBtn" title="切换升序/降序">升序</button>
        <button id="fileOnlyBtn" title="只显示文件">仅文件</button>
        <button id="showDirsBtn" class="active" title="显示目录">显示目录</button>
      </div>
      <div class="toolbar-right">
        <span class="badge" id="resultInfo"></span>
        <div class="view-menu-wrap">
          <button id="viewBtn" class="view-button" aria-expanded="false" title="选择视图模式">
            <span id="viewLabel">详细列表</span><span>▾</span>
          </button>
          <div id="viewMenu" class="view-menu hidden" aria-label="视图模式">
            <button class="active" data-view="details">详细列表<span>✓</span></button>
            <button data-view="content">内容<span></span></button>
            <button data-view="small">小图标<span></span></button>
            <button data-view="medium">中图标<span></span></button>
            <button data-view="large">大图标<span></span></button>
            <button data-view="tile">平铺<span></span></button>
          </div>
        </div>
      </div>
    </section>

    <main class="main" id="main">
      <aside class="sidebar" id="sidebar">
        <div class="pane-head"><span>目录树</span><span class="badge" id="folderCount"></span></div>
        <nav class="tree" id="tree" aria-label="目录树"></nav>
      </aside>
      <div class="splitter" id="splitter" title="拖动调整目录栏宽度"></div>
      <section class="content">
        <nav class="breadcrumb" id="breadcrumb" aria-label="面包屑路径"></nav>
        <div class="statusbar">
          <span id="directorySummary"></span>
        </div>
        <div class="file-panel" id="filePanel">
          <div id="detailView">
            <table>
              <colgroup>
                <col data-col="name" style="width: 28%">
                <col data-col="size" style="width: 12%">
                <col data-col="mtime" style="width: 17%">
                <col data-col="type" style="width: 12%">
                <col data-col="path" style="width: 31%">
              </colgroup>
              <thead>
                <tr>
                  <th class="sortable" data-sort="name"><div class="th-inner">名称<span class="sort-mark"></span><span class="resize-handle" data-col="0"></span></div></th>
                  <th class="sortable" data-sort="size"><div class="th-inner">大小<span class="sort-mark"></span><span class="resize-handle" data-col="1"></span></div></th>
                  <th class="sortable" data-sort="mtime"><div class="th-inner">修改时间<span class="sort-mark"></span><span class="resize-handle" data-col="2"></span></div></th>
                  <th class="sortable" data-sort="type"><div class="th-inner">类型/扩展名<span class="sort-mark"></span><span class="resize-handle" data-col="3"></span></div></th>
                  <th class="sortable" data-sort="path"><div class="th-inner">完整路径<span class="sort-mark"></span><span class="resize-handle" data-col="4"></span></div></th>
                </tr>
              </thead>
              <tbody id="fileRows"></tbody>
            </table>
          </div>
          <div id="cardView" class="cards hidden"></div>
          <div id="emptyState" class="empty hidden">
            <div>
              <strong>没有符合条件的文件</strong>
              <span>请调整搜索关键词、类型筛选或显示目录设置。</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const DISK_INFO = {
      driveLetter: "H:",
      serialNumber: "USB-2026-08-14-A9F3",
      lastScanTime: 1786695900,
      exportTime: 1786700700,
      usedBytes: 486 * 1024 * 1024 * 1024,
      totalBytes: 932 * 1024 * 1024 * 1024
    };

    const DATA = [
      ["H:\\", "H:", "", true, 0, 1786695600, ""],
      ["H:\\照片", "照片", "H:\\", true, 0, 1786601200, ""],
      ["H:\\照片\\旅行", "旅行", "H:\\照片", true, 0, 1786601300, ""],
      ["H:\\照片\\旅行\\青海湖.jpg", "青海湖.jpg", "H:\\照片\\旅行", false, 5489216, 1786201200, "jpg"],
      ["H:\\照片\\旅行\\日落.png", "日落.png", "H:\\照片\\旅行", false, 3948544, 1786208800, "png"],
      ["H:\\照片\\证件照.webp", "证件照.webp", "H:\\照片", false, 785612, 1786122400, "webp"],
      ["H:\\视频", "视频", "H:\\", true, 0, 1786500200, ""],
      ["H:\\视频\\家庭录像.mp4", "家庭录像.mp4", "H:\\视频", false, 734003200, 1786420200, "mp4"],
      ["H:\\视频\\剪辑素材.mov", "剪辑素材.mov", "H:\\视频", false, 1288490188, 1786415000, "mov"],
      ["H:\\音乐", "音乐", "H:\\", true, 0, 1786300200, ""],
      ["H:\\音乐\\现场录音.flac", "现场录音.flac", "H:\\音乐", false, 48234496, 1786100200, "flac"],
      ["H:\\音乐\\播客.mp3", "播客.mp3", "H:\\音乐", false, 19844352, 1786120200, "mp3"],
      ["H:\\文档", "文档", "H:\\", true, 0, 1786400200, ""],
      ["H:\\文档\\合同.pdf", "合同.pdf", "H:\\文档", false, 2101248, 1786322200, "pdf"],
      ["H:\\文档\\读书笔记.docx", "读书笔记.docx", "H:\\文档", false, 365568, 1786011200, "docx"],
      ["H:\\文档\\预算表.xlsx", "预算表.xlsx", "H:\\文档", false, 549888, 1786001200, "xlsx"],
      ["H:\\备份", "备份", "H:\\", true, 0, 1786502200, ""],
      ["H:\\备份\\项目源码.zip", "项目源码.zip", "H:\\备份", false, 89128960, 1786502200, "zip"],
      ["H:\\备份\\老电脑镜像.7z", "老电脑镜像.7z", "H:\\备份", false, 2147483648, 1786499200, "7z"],
      ["H:\\工具", "工具", "H:\\", true, 0, 1786512200, ""],
      ["H:\\工具\\DiskInfo.exe", "DiskInfo.exe", "H:\\工具", false, 15646720, 1786440000, "exe"],
      ["H:\\工具\\清单生成器.msi", "清单生成器.msi", "H:\\工具", false, 33792000, 1786440200, "msi"],
      ["H:\\工具\\配置.json", "配置.json", "H:\\工具", false, 2450, 1786440500, "json"],
      ["H:\\临时", "临时", "H:\\", true, 0, 1786515200, ""],
      ["H:\\临时\\未分类文件.bin", "未分类文件.bin", "H:\\临时", false, 1048576, 1786515200, "bin"]
    ];

    const TYPE_GROUPS = {
      video: new Set(["mp4", "mkv", "avi", "mov", "wmv", "flv", "webm", "m4v", "ts"]),
      image: new Set(["jpg", "jpeg", "png", "gif", "bmp", "webp", "tif", "tiff", "heic", "raw"]),
      audio: new Set(["mp3", "wav", "flac", "aac", "m4a", "ogg", "wma"]),
      document: new Set(["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "txt", "md", "csv", "rtf", "epub"]),
      archive: new Set(["zip", "rar", "7z", "tar", "gz", "bz2", "xz", "iso"]),
      program: new Set(["exe", "msi", "bat", "cmd", "ps1", "apk", "app", "dmg", "sh", "jar"])
    };

    const state = {
      currentPath: DATA[0][0],
      expanded: new Set([DATA[0][0]]),
      search: "",
      typeFilter: "all",
      fileOnly: false,
      showDirs: true,
      sortKey: "name",
      sortDir: "asc",
      view: "details"
    };

    const nodes = DATA.map(([path, name, parent, isDir, size, mtime, ext]) => ({
      path,
      name,
      parent,
      isDir,
      size,
      mtime,
      ext: (ext || "").toLowerCase()
    }));
    const byPath = new Map(nodes.map(item => [item.path, item]));
    const childrenByParent = new Map();
    nodes.forEach(item => {
      if (!childrenByParent.has(item.parent)) childrenByParent.set(item.parent, []);
      childrenByParent.get(item.parent).push(item);
    });
    const root = nodes.find(item => item.isDir && !item.parent) || nodes.find(item => item.isDir);

    const els = {
      main: document.getElementById("main"),
      splitter: document.getElementById("splitter"),
      tree: document.getElementById("tree"),
      breadcrumb: document.getElementById("breadcrumb"),
      fileRows: document.getElementById("fileRows"),
      cardView: document.getElementById("cardView"),
      detailView: document.getElementById("detailView"),
      emptyState: document.getElementById("emptyState"),
      searchInput: document.getElementById("searchInput"),
      typeFilter: document.getElementById("typeFilter"),
      sortSelect: document.getElementById("sortSelect"),
      sortDirBtn: document.getElementById("sortDirBtn"),
      fileOnlyBtn: document.getElementById("fileOnlyBtn"),
      showDirsBtn: document.getElementById("showDirsBtn"),
      rootBtn: document.getElementById("rootBtn"),
      parentBtn: document.getElementById("parentBtn"),
      viewBtn: document.getElementById("viewBtn"),
      viewLabel: document.getElementById("viewLabel"),
      viewMenu: document.getElementById("viewMenu"),
      resultInfo: document.getElementById("resultInfo"),
      folderCount: document.getElementById("folderCount"),
      activePathBadge: document.getElementById("activePathBadge"),
      directorySummary: document.getElementById("directorySummary")
    };

    const VIEW_LABELS = {
      details: "详细列表",
      content: "内容",
      small: "小图标",
      medium: "中图标",
      large: "大图标",
      tile: "平铺"
    };

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB", "PB"];
      let value = bytes;
      let index = 0;
      while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index++;
      }
      const digits = value >= 100 || index === 0 ? 0 : value >= 10 ? 1 : 2;
      return `${value.toFixed(digits)} ${units[index]}`;
    }

    function formatTime(ts) {
      if (!ts) return "-";
      return new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false });
    }

    function getTypeGroup(item) {
      if (item.isParentShortcut) return "up";
      if (item.isDir) return "folder";
      for (const [group, exts] of Object.entries(TYPE_GROUPS)) {
        if (exts.has(item.ext)) return group;
      }
      return "other";
    }

    function getType(item) {
      if (item.isParentShortcut) return "上级目录";
      if (item.isDir) return "文件夹";
      const group = getTypeGroup(item);
      const labels = {
        video: "视频",
        image: "图片",
        audio: "音频",
        document: "文档",
        archive: "压缩包",
        program: "程序",
        other: item.ext ? item.ext.toUpperCase() : "其他"
      };
      return labels[group];
    }

    function typeMatches(item) {
      if (state.typeFilter === "all") return true;
      if (item.isDir) return state.showDirs && !state.fileOnly;
      if (state.typeFilter === "other") {
        return !Object.values(TYPE_GROUPS).some(set => set.has(item.ext));
      }
      return TYPE_GROUPS[state.typeFilter].has(item.ext);
    }

    function createTypeIcon(item, sizeClass) {
      const group = getTypeGroup(item);
      const icon = document.createElement("span");
      icon.className = `type-icon ${sizeClass || "small"} type-${group}`;

      const art = document.createElement("span");
      art.className = `type-art art-${group}`;
      const artMarkup = {
        folder: '<span class="folder-tab"></span><span class="folder-body"></span>',
        up: '<span class="folder-tab"></span><span class="folder-body"></span><span class="up-arrow"></span>',
        video: "",
        image: "",
        audio: "",
        document: "",
        archive: "",
        program: "",
        other: ""
      };
      art.innerHTML = artMarkup[group] || "";
      icon.appendChild(art);

      if (!item.isDir && !item.isParentShortcut) {
        const ext = document.createElement("span");
        ext.className = "ext-tag";
        ext.textContent = (item.ext || "FILE").slice(0, 5).toUpperCase();
        icon.appendChild(ext);
      }

      return icon;
    }

    function getParentShortcut() {
      const parent = byPath.get(state.currentPath)?.parent;
      if (!parent || state.search.trim()) return null;
      return {
        path: parent,
        name: ".. 返回上一级",
        parent: state.currentPath,
        isDir: true,
        isParentShortcut: true,
        size: 0,
        mtime: 0,
        ext: ""
      };
    }

    function getAncestorPaths(path) {
      const paths = [];
      let current = byPath.get(path);
      while (current) {
        paths.unshift(current.path);
        current = byPath.get(current.parent);
      }
      return paths;
    }

    function setExpandedToPath(path) {
      state.expanded = new Set(getAncestorPaths(path));
    }

    function countDescendantFiles(path) {
      const prefix = path.endsWith("\\") ? path : path + "\\";
      return nodes.filter(item => !item.isDir && item.path.startsWith(prefix)).length;
    }

    function getVisibleItems() {
      const query = state.search.trim().toLowerCase();
      let items = query
        ? nodes.filter(item => item.path.toLowerCase().includes(query) || item.name.toLowerCase().includes(query))
        : (childrenByParent.get(state.currentPath) || []);

      items = items.filter(item => {
        if (item.isDir && (state.fileOnly || !state.showDirs)) return false;
        if (!typeMatches(item)) return false;
        return true;
      });

      items.sort(compareItems);
      return items;
    }

    function compareItems(a, b) {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
      let result = 0;
      if (state.sortKey === "name") {
        result = a.name.localeCompare(b.name, "zh-CN", { numeric: true });
      } else if (state.sortKey === "size") {
        result = a.size - b.size;
      } else if (state.sortKey === "mtime") {
        result = a.mtime - b.mtime;
      } else if (state.sortKey === "type") {
        result = getType(a).localeCompare(getType(b), "zh-CN", { numeric: true }) || a.ext.localeCompare(b.ext);
      } else if (state.sortKey === "path") {
        result = a.path.localeCompare(b.path, "zh-CN", { numeric: true });
      }
      return state.sortDir === "asc" ? result : -result;
    }

    function enterDirectory(path) {
      if (!byPath.get(path)?.isDir) return;
      state.currentPath = path;
      setExpandedToPath(path);
      render();
    }

    function renderSummary() {
      const files = nodes.filter(item => !item.isDir);
      const dirs = nodes.filter(item => item.isDir);
      const totalFileBytes = files.reduce((sum, item) => sum + item.size, 0);
      const pct = Math.min(100, Math.round((DISK_INFO.usedBytes / DISK_INFO.totalBytes) * 1000) / 10);
      document.getElementById("driveLetter").textContent = DISK_INFO.driveLetter;
      document.getElementById("serialNumber").textContent = DISK_INFO.serialNumber;
      document.getElementById("fileCount").textContent = `${files.length.toLocaleString("zh-CN")} 个`;
      document.getElementById("totalFileSize").textContent = formatBytes(totalFileBytes);
      document.getElementById("scanTime").textContent = formatTime(DISK_INFO.lastScanTime);
      document.getElementById("exportTime").textContent = formatTime(DISK_INFO.exportTime);
      document.getElementById("capacityText").textContent = `${formatBytes(DISK_INFO.usedBytes)} / ${formatBytes(DISK_INFO.totalBytes)}`;
      document.getElementById("capacityPct").textContent = `${pct}%`;
      document.getElementById("capacityBar").style.width = `${pct}%`;
      els.folderCount.textContent = `${dirs.length} 个目录`;
    }

    function renderTree() {
      els.tree.replaceChildren(renderTreeNode(root, 0));
    }

    function renderTreeNode(item) {
      const wrap = document.createElement("div");
      const kids = (childrenByParent.get(item.path) || []).filter(child => child.isDir)
        .sort((a, b) => a.name.localeCompare(b.name, "zh-CN", { numeric: true }));
      const isExpanded = state.expanded.has(item.path);

      const row = document.createElement("div");
      row.className = `tree-node${item.path === state.currentPath ? " active" : ""}`;
      row.title = item.path;
      row.dataset.path = item.path;

      const twisty = document.createElement("span");
      twisty.className = "twisty";
      twisty.textContent = kids.length ? (isExpanded ? "▾" : "▸") : "";
      twisty.addEventListener("click", event => {
        event.stopPropagation();
        if (state.expanded.has(item.path)) state.expanded.delete(item.path);
        else state.expanded.add(item.path);
        renderTree();
      });

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name || item.path;

      const count = document.createElement("span");
      count.className = "count";
      count.textContent = countDescendantFiles(item.path);

      row.append(twisty, name, count);
      row.addEventListener("click", () => enterDirectory(item.path));
      wrap.appendChild(row);

      if (kids.length && isExpanded) {
        const children = document.createElement("div");
        children.className = "tree-children";
        kids.forEach(child => children.appendChild(renderTreeNode(child)));
        wrap.appendChild(children);
      }
      return wrap;
    }

    function buildBreadcrumbPaths(path) {
      const chain = [];
      let current = byPath.get(path);
      while (current) {
        chain.unshift(current);
        current = byPath.get(current.parent);
      }
      return chain;
    }

    function renderBreadcrumb() {
      const chain = buildBreadcrumbPaths(state.currentPath);
      els.breadcrumb.replaceChildren();
      chain.forEach((item, index) => {
        if (index > 0) {
          const sep = document.createElement("span");
          sep.className = "crumb-sep";
          sep.textContent = ">";
          els.breadcrumb.appendChild(sep);
        }
        const crumb = document.createElement("span");
        crumb.className = "crumb";
        crumb.textContent = item.name || item.path;
        crumb.title = item.path;
        crumb.addEventListener("click", () => enterDirectory(item.path));
        els.breadcrumb.appendChild(crumb);
      });
      els.activePathBadge.textContent = state.currentPath;
    }

    function renderDetails(items) {
      els.fileRows.replaceChildren();
      const parentShortcut = getParentShortcut();
      const rows = parentShortcut ? [parentShortcut, ...items] : items;
      for (const item of rows) {
        const tr = document.createElement("tr");
        tr.className = item.isDir ? "dir" : "";
        tr.title = item.path;

        const nameTd = document.createElement("td");
        const nameBox = document.createElement("div");
        nameBox.className = "name-cell";
        const icon = createTypeIcon(item, "small");
        const name = document.createElement("span");
        name.className = "clickable-name";
        name.textContent = item.name;
        if (item.isDir) name.addEventListener("click", () => enterDirectory(item.path));
        nameBox.append(icon, name);
        nameTd.appendChild(nameBox);

        const sizeTd = document.createElement("td");
        sizeTd.textContent = item.isDir ? "-" : formatBytes(item.size);

        const mtimeTd = document.createElement("td");
        mtimeTd.textContent = formatTime(item.mtime);

        const typeTd = document.createElement("td");
        typeTd.textContent = item.isParentShortcut ? "上级目录" : item.isDir ? "文件夹" : `${getType(item)}${item.ext ? " / ." + item.ext : ""}`;

        const pathTd = document.createElement("td");
        pathTd.textContent = item.path;

        tr.append(nameTd, sizeTd, mtimeTd, typeTd, pathTd);
        if (item.isDir) tr.addEventListener("dblclick", () => enterDirectory(item.path));
        els.fileRows.appendChild(tr);
      }
    }

    function renderCards(items) {
      els.cardView.className = `cards ${state.view}`;
      els.cardView.replaceChildren();
      const parentShortcut = getParentShortcut();
      const cards = parentShortcut ? [parentShortcut, ...items] : items;
      for (const item of cards) {
        const card = document.createElement("article");
        card.className = `file-card${item.isDir ? " folder" : ""}`;
        card.title = item.path;
        if (item.isDir) card.addEventListener("click", () => enterDirectory(item.path));

        const icon = createTypeIcon(item, "card");

        if (state.view === "content") {
          const lines = document.createElement("div");
          lines.className = "content-lines";
          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = item.name;
          const meta = document.createElement("div");
          meta.className = "content-meta";
          const type = item.isParentShortcut ? "返回父目录" : getType(item);
          const size = item.isDir || item.isParentShortcut ? "" : formatBytes(item.size);
          const time = item.isParentShortcut ? "" : formatTime(item.mtime);
          [type, size, time].filter(Boolean).forEach(text => {
            const span = document.createElement("span");
            span.textContent = text;
            meta.appendChild(span);
          });
          const path = document.createElement("div");
          path.className = "content-path";
          path.textContent = item.path;
          lines.append(name, meta, path);
          card.append(icon, lines);
        } else if (state.view === "tile") {
          const lines = document.createElement("div");
          lines.className = "tile-lines";
          const name = document.createElement("div");
          name.className = "tile-name";
          name.textContent = item.name;
          const meta = document.createElement("div");
          meta.className = "card-meta";
          meta.textContent = item.isParentShortcut ? "返回父目录" : `${item.isDir ? "文件夹" : formatBytes(item.size)} · ${formatTime(item.mtime)} · ${getType(item)}`;
          const path = document.createElement("div");
          path.className = "tile-path";
          path.textContent = item.path;
          lines.append(name, meta, path);
          card.append(icon, lines);
        } else {
          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = item.name;
          const meta = document.createElement("div");
          meta.className = "card-meta";
          meta.textContent = item.isParentShortcut ? "返回父目录" : item.isDir ? "文件夹" : `${formatBytes(item.size)} · .${item.ext || "other"}`;
          card.append(icon, name, meta);
        }
        els.cardView.appendChild(card);
      }
    }

    function renderSortMarks() {
      document.querySelectorAll("th.sortable").forEach(th => {
        const mark = th.querySelector(".sort-mark");
        mark.textContent = th.dataset.sort === state.sortKey ? (state.sortDir === "asc" ? "▲" : "▼") : "";
      });
      els.sortSelect.value = state.sortKey;
      els.sortDirBtn.textContent = state.sortDir === "asc" ? "升序" : "降序";
      els.parentBtn.disabled = !byPath.get(state.currentPath)?.parent;
      els.viewLabel.textContent = VIEW_LABELS[state.view];
      els.viewMenu.querySelectorAll("button").forEach(button => {
        const active = button.dataset.view === state.view;
        button.classList.toggle("active", active);
        button.querySelector("span").textContent = active ? "✓" : "";
      });
    }

    function renderStatus(items) {
      const fileCount = items.filter(item => !item.isDir).length;
      const dirCount = items.filter(item => item.isDir).length;
      const bytes = items.filter(item => !item.isDir).reduce((sum, item) => sum + item.size, 0);
      const mode = state.search.trim() ? "搜索结果" : "当前目录";
      els.resultInfo.textContent = `${items.length} 项`;
      els.directorySummary.textContent = `${mode}: ${dirCount} 个目录，${fileCount} 个文件，合计 ${formatBytes(bytes)}`;
    }

    function render() {
      const items = getVisibleItems();
      const hasParentShortcut = Boolean(getParentShortcut());
      renderSummary();
      renderTree();
      renderBreadcrumb();
      renderSortMarks();
      renderStatus(items);

      const isDetails = state.view === "details";
      const hasContent = items.length > 0 || hasParentShortcut;
      els.detailView.classList.toggle("hidden", !isDetails || !hasContent);
      els.cardView.classList.toggle("hidden", isDetails || !hasContent);
      els.emptyState.classList.toggle("hidden", hasContent);

      if (isDetails) renderDetails(items);
      else renderCards(items);
    }

    function bindControls() {
      els.searchInput.addEventListener("input", event => {
        state.search = event.target.value;
        render();
      });

      els.typeFilter.addEventListener("change", event => {
        state.typeFilter = event.target.value;
        render();
      });

      els.sortSelect.addEventListener("change", event => {
        state.sortKey = event.target.value;
        render();
      });

      els.sortDirBtn.addEventListener("click", () => {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        render();
      });

      els.fileOnlyBtn.addEventListener("click", () => {
        state.fileOnly = !state.fileOnly;
        if (state.fileOnly) state.showDirs = false;
        els.fileOnlyBtn.classList.toggle("active", state.fileOnly);
        els.showDirsBtn.classList.toggle("active", state.showDirs);
        render();
      });

      els.showDirsBtn.addEventListener("click", () => {
        state.showDirs = !state.showDirs;
        if (state.showDirs) state.fileOnly = false;
        els.fileOnlyBtn.classList.toggle("active", state.fileOnly);
        els.showDirsBtn.classList.toggle("active", state.showDirs);
        render();
      });

      els.rootBtn.addEventListener("click", () => {
        enterDirectory(root.path);
      });

      els.parentBtn.addEventListener("click", () => {
        const parent = byPath.get(state.currentPath)?.parent;
        if (parent) enterDirectory(parent);
      });

      els.viewBtn.addEventListener("click", event => {
        event.stopPropagation();
        const open = els.viewMenu.classList.toggle("hidden");
        els.viewBtn.setAttribute("aria-expanded", String(!open));
      });

      els.viewMenu.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          state.view = button.dataset.view;
          els.viewMenu.classList.add("hidden");
          els.viewBtn.setAttribute("aria-expanded", "false");
          render();
        });
      });

      document.addEventListener("click", event => {
        if (!els.viewMenu.contains(event.target) && !els.viewBtn.contains(event.target)) {
          els.viewMenu.classList.add("hidden");
          els.viewBtn.setAttribute("aria-expanded", "false");
        }
      });

      document.querySelectorAll("th.sortable").forEach(th => {
        th.addEventListener("click", event => {
          if (event.target.classList.contains("resize-handle")) return;
          const key = th.dataset.sort;
          if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
          else {
            state.sortKey = key;
            state.sortDir = "asc";
          }
          render();
        });
      });
    }

    function bindSidebarResize() {
      let dragging = false;
      els.splitter.addEventListener("pointerdown", event => {
        dragging = true;
        els.splitter.setPointerCapture(event.pointerId);
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
      });
      els.splitter.addEventListener("pointermove", event => {
        if (!dragging) return;
        const mainRect = els.main.getBoundingClientRect();
        const width = Math.max(180, Math.min(620, event.clientX - mainRect.left));
        document.documentElement.style.setProperty("--sidebar-width", `${width}px`);
      });
      els.splitter.addEventListener("pointerup", event => {
        dragging = false;
        els.splitter.releasePointerCapture(event.pointerId);
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      });
    }

    function bindColumnResize() {
      const table = document.querySelector("table");
      const cols = Array.from(document.querySelectorAll("colgroup col"));
      let active = null;

      document.querySelectorAll(".resize-handle").forEach(handle => {
        handle.addEventListener("pointerdown", event => {
          event.stopPropagation();
          const index = Number(handle.dataset.col);
          const rect = cols[index].getBoundingClientRect();
          active = { index, startX: event.clientX, startWidth: rect.width };
          handle.setPointerCapture(event.pointerId);
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
        });

        handle.addEventListener("pointermove", event => {
          if (!active) return;
          const width = Math.max(86, active.startWidth + event.clientX - active.startX);
          const total = table.getBoundingClientRect().width;
          cols[active.index].style.width = `${(width / total) * 100}%`;
        });

        handle.addEventListener("pointerup", event => {
          active = null;
          handle.releasePointerCapture(event.pointerId);
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        });
      });
    }

    bindControls();
    bindSidebarResize();
    bindColumnResize();
    render();
  </script>
</body>
</html>
